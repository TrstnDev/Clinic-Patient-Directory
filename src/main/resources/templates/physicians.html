<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Clinic Physician Roster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="#">Clinical Management System</a>
    <div class="navbar-nav">
      <a class="nav-link" th:href="@{/patients}">Patients</a>
      <a class="nav-link active" th:href="@{/physicians}">Physicians</a>
    </div>
  </div>
</nav>

<div class="container-fluid px-5">
  <h1 class="mb-4 text-success">Clinic Physician Roster</h1>

  <div class="card shadow-sm mb-4 border-secondary">
    <div class="card-body py-2">
      <form th:action="@{/physicians}" method="get" class="row g-2 align-items-center">
        <div class="col-auto">
          <select name="searchType" class="form-select">
            <option value="Name" th:selected="${searchType == 'Name'}">First Name</option>
            <option value="Surname" th:selected="${searchType == 'Surname'}">Surname</option>
            <option value="HPCSA Number" th:selected="${searchType == 'HPCSA Number'}">HPCSA Number</option>
            <option value="RSA ID" th:selected="${searchType == 'RSA ID'}">RSA ID</option>
            <option value="Specialty" th:selected="${searchType == 'Specialty'}">Specialty</option>
          </select>
        </div>
        <div class="col-md-4">
          <input type="text" name="keyword" class="form-control" placeholder="Search query..." th:value="${keyword}">
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-secondary">Search</button>
          <a th:href="@{/physicians}" class="btn btn-outline-secondary">Clear</a>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm mb-5 border-success">
    <div class="card-header bg-success text-white">
      <h4 class="mb-0">Onboard New Physician</h4>
    </div>
    <div class="card-body">
      <form th:action="@{/physicians}" th:object="${newPhysician}" method="post" class="row g-3">

        <div class="col-md-4">
          <label for="physicianRsaId" class="form-label">RSA ID Number</label>
          <input type="text" id="physicianRsaId" th:field="*{physicianRsaId}" class="form-control" th:classappend="${#fields.hasErrors('physicianRsaId')} ? 'is-invalid' : ''" required maxlength="13" />
          <div th:if="${#fields.hasErrors('physicianRsaId')}" th:errors="*{physicianRsaId}" class="invalid-feedback"></div>
        </div>
        <div class="col-md-4">
          <label for="inputFirstName" class="form-label">First Name</label>
          <input type="text" id="inputFirstName" th:field="*{inputFirstName}" class="form-control" required />
        </div>
        <div class="col-md-4">
          <label for="inputSurname" class="form-label">Surname</label>
          <input type="text" id="inputSurname" th:field="*{inputSurname}" class="form-control" required />
        </div>

        <div class="col-md-5">
          <label for="role" class="form-label">Role</label>
          <select id="role" th:field="*{role}" class="form-select" required>
            <option value="" disabled selected>Select a role...</option>
            <option th:each="r : ${rolesList}" th:value="${r.id}" th:text="${r.roleTitle + ' ' + r.roleName}"></option>
          </select>
        </div>
        <div class="col-md-5">
          <label for="specialty" class="form-label">Specialty</label>
          <select id="specialty" th:field="*{specialty}" class="form-select" required>
            <option value="" disabled selected>Select a specialty...</option>
            <option th:each="s : ${specialtiesList}" th:value="${s.id}" th:text="${s.specialtyTitle}"></option>
          </select>
        </div>

        <div class="col-md-2 d-flex align-items-end">
          <button type="submit" class="btn btn-success w-100">Add Physician</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0 table-responsive">
      <table class="table table-striped table-hover mb-0">
        <thead class="table-dark">
        <tr>
          <th>HPCSA Number</th>
          <th>RSA ID</th>
          <th>Physician Name</th>
          <th>Role</th>
          <th>Specialty</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="doc : ${physicians}">
          <td th:text="${doc.hpcsaNumber}" class="fw-bold"></td>
          <td th:text="${doc.physicianRsaId}"></td>
          <td th:text="${doc.physicianName + ' ' + doc.physicianSurname}"></td>
          <td th:text="${doc.role?.roleName}"></td>
          <td th:text="${doc.specialty?.specialtyTitle}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
