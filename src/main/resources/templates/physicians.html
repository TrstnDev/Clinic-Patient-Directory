<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Clinic Physician Roster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="#">Clinic Admin</a>
    <div class="navbar-nav">
      <a class="nav-link" th:href="@{/patients}">Patients</a>
      <a class="nav-link active" th:href="@{/physicians}">Physicians</a>
    </div>
  </div>
</nav>

<div class="container">
  <h1 class="mb-4 text-success">Physician Roster</h1>

  <div class="card shadow-sm mb-5 border-success">
    <div class="card-header bg-success text-white">
      <h4 class="mb-0">Onboard New Physician</h4>
    </div>
    <div class="card-body">
      <form th:action="@{/physicians}" th:object="${newPhysician}" method="post" class="row g-3">
        <div class="col-md-3">
          <label for="inputFirstName" class="form-label">First Name</label>
          <input type="text" id="inputFirstName" th:field="*{inputFirstName}" class="form-control" required placeholder="e.g. Sarah" />
        </div>
        <div class="col-md-3">
          <label for="inputSurname" class="form-label">Surname</label>
          <input type="text" id="inputSurname" th:field="*{inputSurname}" class="form-control" required placeholder="e.g. Connor" />
        </div>
        <div class="col-md-4">
          <label for="specialty" class="form-label">Specialty</label>
          <select id="specialty" th:field="*{specialty}" class="form-select" required>
            <option value="" disabled selected>Select a specialty...</option>
            <option value="General Practitioner">General Practitioner</option>
            <option value="Orthopaedic Surgeon">Orthopaedic Surgeon</option>
            <option value="Gynaecologist">Gynaecologist</option>
            <option value="Cardiologist">Cardiologist</option>
            <option value="Neurologist">Neurologist</option>
          </select>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button type="submit" class="btn btn-success w-100">Add Physician</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-striped table-hover mb-0">
        <thead class="table-dark">
        <tr>
          <th>HPCSA Number (ID)</th>
          <th>Physician Name</th>
          <th>Specialty</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="doc : ${physicians}">
          <td th:text="${doc.hpcsaNumber}">ABCDEF12345</td>
          <td th:text="${doc.physicianName}">Dr. Sarah Connor</td>
          <td th:text="${doc.specialty}">Orthopaedic Surgeon</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>
