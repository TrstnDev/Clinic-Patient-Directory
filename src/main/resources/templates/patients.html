<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clinic Patient Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Clinical Management System</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/patients}">Patients</a>
            <a class="nav-link" th:href="@{/physicians}">Physicians</a>
        </div>
    </div>
</nav>

<div class="container-fluid px-5">
    <h1 class="mb-4 text-primary">Clinic Patient Directory</h1>

    <div class="card shadow-sm mb-5 border-primary">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Admit New Patient</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/patients}" th:object="${newPatient}" method="post" class="row g-3">

                <div class="col-md-3">
                    <label for="patientRsaId" class="form-label">RSA ID Number</label>
                    <input type="text" id="patientRsaId" th:field="*{patientRsaId}" class="form-control" th:classappend="${#fields.hasErrors('patientRsaId')} ? 'is-invalid' : ''" required maxlength="13" />
                    <div th:if="${#fields.hasErrors('patientRsaId')}" th:errors="*{patientRsaId}" class="invalid-feedback"></div>
                </div>
                <div class="col-md-2">
                    <label for="dateOfBirth" class="form-label">Date of Birth</label>
                    <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" class="form-control" required />
                </div>
                <div class="col-md-2">
                    <label for="patientTitle" class="form-label">Title</label>
                    <select id="patientTitle" th:field="*{patientTitle}" class="form-select">
                        <option value="Mr.">Mr.</option>
                        <option value="Ms.">Ms.</option>
                        <option value="Mrs.">Mrs.</option>
                        <option value="Dr.">Dr.</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="patientName" class="form-label">First Name</label>
                    <input type="text" id="patientName" th:field="*{patientName}" class="form-control" required />
                </div>
                <div class="col-md-3">
                    <label for="patientSurname" class="form-label">Surname</label>
                    <input type="text" id="patientSurname" th:field="*{patientSurname}" class="form-control" required />
                </div>

                <div class="col-md-3">
                    <label for="patientCell" class="form-label">Cellphone</label>
                    <input type="text" id="patientCell" th:field="*{patientCell}" class="form-control" th:classappend="${#fields.hasErrors('patientCell')} ? 'is-invalid' : ''" placeholder="0821234567" />
                    <div th:if="${#fields.hasErrors('patientCell')}" th:errors="*{patientCell}" class="invalid-feedback"></div>
                </div>
                <div class="col-md-3">
                    <label for="patientEmail" class="form-label">Email</label>
                    <input type="email" id="patientEmail" th:field="*{patientEmail}" class="form-control" th:classappend="${#fields.hasErrors('patientEmail')} ? 'is-invalid' : ''" />
                    <div th:if="${#fields.hasErrors('patientEmail')}" th:errors="*{patientEmail}" class="invalid-feedback"></div>
                </div>
                <div class="col-md-6">
                    <label for="patientAddress" class="form-label">Physical Address</label>
                    <input type="text" id="patientAddress" th:field="*{patientAddress}" class="form-control" />
                </div>

                <div class="col-md-2">
                    <label for="admissionDate" class="form-label">Admission Date</label>
                    <input type="date" id="admissionDate" th:field="*{admissionDate}" class="form-control" required />
                </div>
                <div class="col-md-2">
                    <label for="dischargeDate" class="form-label">Discharge Date</label>
                    <input type="date" id="dischargeDate" th:field="*{dischargeDate}" class="form-control" />
                </div>
                <div class="col-md-3">
                    <label for="primaryDiagnosis" class="form-label">Primary Diagnosis (ICD-10)</label>
                    <select id="primaryDiagnosis" th:field="*{primaryDiagnosis}" class="form-select">
                        <option value="" disabled selected>Select diagnosis...</option>
                        <option th:each="d : ${diagnosesList}" th:value="${d.icd10Code}" th:text="${d.icd10Code + ' - ' + d.diagnosisName}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="treatingPhysician" class="form-label">Treating Physician</label>
                    <select id="treatingPhysician" th:field="*{treatingPhysician}" class="form-select">
                        <option value="" disabled selected>Assign physician...</option>
                        <option th:each="doc : ${physiciansList}" th:value="${doc.hpcsaId}" th:text="${doc.physicianName + ' ' + doc.physicianSurname}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Admit Patient</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Patient ID</th>
                    <th>RSA ID</th>
                    <th>Name</th>
                    <th>DOB</th>
                    <th>Admission</th>
                    <th>Primary Diagnosis</th>
                    <th>Treating Physician</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="patient : ${patients}">
                    <td th:text="${patient.patientId}">JOH1234</td>
                    <td th:text="${patient.patientRsaId}">9001015000000</td>
                    <td th:text="${patient.patientTitle + ' ' + patient.patientName + ' ' + patient.patientSurname}">Mr. John Doe</td>
                    <td th:text="${patient.dateOfBirth}">1990-01-01</td>
                    <td th:text="${patient.admissionDate}">2026-02-26</td>
                    <td th:text="${patient.primaryDiagnosis?.diagnosisName + ' (' + patient.primaryDiagnosis?.icd10Code + ')'}">Bronchitis</td>
                    <td th:text="${patient.treatingPhysician?.physicianName + ' ' + patient.treatingPhysician?.physicianSurname}">Dr. Smith</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
