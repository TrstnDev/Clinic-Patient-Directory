<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clinic Patient Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="mb-4 text-primary">Clinic Patient Directory</h1>

    <div class="card shadow-sm mb-5">


        <div class="card-header bg-white">
            <h4 class="mb-0">Add New Patient</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/patients}" th:object="${newPatient}" method="post" class="row g-3">
                <div class="col-md-5">
                    <label for="name" class="form-label">Patient Name</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" required placeholder="e.g. Jane Doe" />
                </div>
                <div class="col-md-5">
                    <label for="diagnosis" class="form-label">Diagnosis</label>
                    <input type="text" id="diagnosis" th:field="*{diagnosis}" class="form-control" required placeholder="e.g. Common Cold" />
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Add Patient</button>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="card shadow-sm mb-4 border-danger">
        <div class="card-body">
            <form th:action="@{/patients/delete-request}" method="post" class="row g-3 align-items-center">
                <div class="col-auto">
                    <label for="patientId" class="col-form-label fw-bold text-danger">Delete Patient by ID:</label>
                </div>
                <div class="col-auto">
                    <input type="text" id="patientId" name="patientId" class="form-control" placeholder="e.g. JOH1234" required />
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-outline-danger">Request Deletion</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Diagnosis</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="patient : ${patients}">
                    <td th:text="${patient.id}">1</td>
                    <td th:text="${patient.name}">John Doe</td>
                    <td th:text="${patient.diagnosis}">Healthy</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
