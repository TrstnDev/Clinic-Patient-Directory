<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Confirm Deletion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="card shadow border-danger mx-auto" style="max-width: 500px;">
    <div class="card-header bg-danger text-white">
      <h4 class="mb-0">Confirm Deletion</h4>
    </div>
    <div class="card-body text-center">
      <h5 class="card-title text-danger">Are you sure you want to delete patient <span th:text="${patientToDelete.name}">Name</span>?</h5>
      <p class="card-text">
        <strong>ID:</strong> <span th:text="${patientToDelete.id}">ID</span><br>
        <strong>Diagnosis:</strong> <span th:text="${patientToDelete.diagnosis}">Diagnosis</span>
      </p>
      <p class="text-muted small">This action cannot be undone.</p>

      <form th:action="@{/patients/delete-confirm}" method="post" class="d-inline">
        <input type="hidden" name="patientId" th:value="${patientToDelete.id}" />
        <button type="submit" class="btn btn-danger">Yes, Delete Patient</button>
      </form>

      <a th:href="@{/patients}" class="btn btn-secondary ms-2">Cancel</a>
    </div>
  </div>
</div>
</body>
</html>
